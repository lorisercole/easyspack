      - spec: gcc@13.2.0 target=haswell
    - spec: fftw@3.3.10+mpi~openmp+shared precision=float,double,long_double target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/FFTW.MPI/3.3.10-gompi-2023b
      dependencies:
      - spec: gcc@13.2.0 target=haswell
      - spec: openmpi@4.1.6 target=haswell
  openblas:
    externals:
    - spec: openblas@0.3.24~ilp64 threads=openmp target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/OpenBLAS/0.3.24-GCC-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
  flexiblas:
    externals:
    - spec: flexiblas@3.3.1 target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/FlexiBLAS/3.3.1-GCC-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
      - spec: openblas@0.3.24 target=haswell
  netlib-scalapack:
    externals:
    - spec: netlib-scalapack@2.2.0+pic+shared target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/ScaLAPACK/2.2.0-gompi-2023b-fb
      dependencies:
      - spec: gcc@13.2.0 target=haswell
      - spec: openmpi@4.1.6 target=haswell
      - spec: flexiblas@3.3.1 target=haswell
  curl:
    externals:
    - spec: curl@8.3.0+nghttp2 tls=openssl target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/cURL/8.3.0-GCCcore-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
      # - spec: zlib@1.2.13  # compat
      - spec: openssl@1.1.1w  # compat
  libarchive:
    externals:
    - spec: libarchive@3.7.2 target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/libarchive/3.7.2-GCCcore-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
  cmake:
    externals:
    - spec: cmake@3.27.6~ownlibs target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/CMake/3.27.6-GCCcore-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
      - spec: curl@8.3.0 target=haswell
      - spec: ncurses@6.4.20230401  # compat
      # - spec: zlib@1.2.13  # compat
      - spec: libarchive@3.7.2 target=haswell
      - spec: bzip2@1.0.8  # compat  # not spack
        deptypes:
        - link
      - spec: openssl@1.1.1w  # compat  # not spack
        deptypes:
        - build
        - link
  numactl:
    externals:
    - spec: numactl@2.0.16 target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/numactl/2.0.16-GCCcore-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
  libxml2:
    externals:
    - spec: libxml2@2.11.5~python target=haswell  # +python only if Python is in the EC dependencies
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/libxml2/2.11.5-GCCcore-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
      # - spec: zlib@1.2.13  # compat
      - spec: xz@5.4.3  # compat
  libevent:
    externals:
    - spec: libevent@2.1.12+openssl target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/libevent/2.1.12-GCCcore-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
      - spec: openssl@1.1.1w  # compat
  libpciaccess:
    externals:
    - spec: libpciaccess@0.17 target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/libpciaccess/0.17-GCCcore-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
  hwloc:
    externals:
    - spec: hwloc@2.9.2~cairo~cuda~opencl~nvml~gl~libudev+libxml2+pci~rocm target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/hwloc/2.9.2-GCCcore-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
      - spec: libpciaccess@0.17 target=haswell  # IMPORTANT! Without it MPICXX will not be able to find libpciaccess symbols
      - spec: libxml2@2.11.5 target=haswell
      - spec: ncurses@6.4.20230401  # compat
      - spec: numactl@2.0.16 target=haswell  # not spack
        deptypes:
        - build
        - link
  ucx:
    externals:
    - spec: ucx@1.15.0~assertions~cuda+cma~debug~java~logging+optimizations~parameter_checking+thread_multiple+verbs target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/ucx/1.15.0-GCCcore-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
      # - spec: zlib@1.2.13  # compat  # not spack
      #   deptypes:
      #   - build
      #   - link
      - spec: numactl@2.0.16 target=haswell  # not spack
        deptypes:
        - build
        - link
  libfabric:
    externals:
    - spec: libfabric@1.19.0 fabrics=opx,psm2,psm3,shm,tcp,udp,verbs target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/libfabric/1.19.0-GCCcore-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
      - spec: numactl@2.0.16 target=haswell
  pmix:
    externals:
    - spec: pmix@4.2.6~munge~python~restful target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/pmix/4.2.6-GCCcore-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
      - spec: libevent@2.1.12 target=haswell
      # - spec: zlib@1.2.13  # compat
      - spec: hwloc@2.9.2 target=haswell
  ucc:
    externals:
    - spec: ucc@1.2.0~cuda~rocm target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/ucc/1.2.0-GCCcore-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
      - spec: ucx@1.15.0 target=haswell
  openmpi:
    externals:
    - spec: openmpi@4.1.6~cuda~cxx~cxx_exceptions+fortran~internal-hwloc~internal-libevent~internal-pmix~java~memchecker+pmi~rocm~static~wrapper-rpath fabrics=ofi,psm2,ucc,ucx schedulers=none target=haswell
      prefix: /cvmfs/software.eessi.io/versions/2023.06/software/linux/x86_64/intel/haswell/software/OpenMPI/4.1.6-GCC-13.2.0
      dependencies:
      - spec: gcc@13.2.0 target=haswell
      # - spec: zlib@1.2.13  # compat
      - spec: hwloc@2.9.2 target=haswell  # without its dependency libpciaccess, CMake cannot find MPI_CXX
      - spec: libevent@2.1.12 target=haswell
      - spec: ucx@1.15.0 target=haswell
      - spec: libfabric@1.19.0 target=haswell
      - spec: pmix@4.2.6 target=haswell
      - spec: ucc@1.2.0 target=haswell
